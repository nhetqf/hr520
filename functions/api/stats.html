<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访问统计数据</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #334155;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: clamp(24px, 5vw, 36px);
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .header p {
            opacity: 0.9;
            font-size: 16px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
        }

        .stat-icon {
            font-size: 40px;
            margin-bottom: 16px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 800;
            color: #667eea;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 14px;
            color: #64748b;
            font-weight: 500;
        }

        .chart-card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .chart-card h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #334155;
        }

        .device-list {
            display: grid;
            gap: 12px;
        }

        .device-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #f8fafc;
            border-radius: 8px;
        }

        .device-icon {
            font-size: 24px;
            margin-right: 12px;
        }

        .device-info {
            flex: 1;
        }

        .device-name {
            font-weight: 600;
            font-size: 15px;
        }

        .device-count {
            font-size: 13px;
            color: #64748b;
        }

        .progress-bar {
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .recent-visits {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .recent-visits h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #334155;
        }

        .visit-list {
            display: grid;
            gap: 12px;
        }

        .visit-item {
            display: flex;
            flex-direction: column;
            padding: 16px;
            background: #f8fafc;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .visit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .visit-time {
            font-size: 14px;
            color: #64748b;
        }

        .visit-country {
            font-size: 12px;
            background: #e0e7ff;
            color: #4f46e5;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .visit-details {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 13px;
            color: #64748b;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .api-link {
            text-align: center;
            margin-top: 30px;
            color: white;
            font-size: 14px;
        }

        .api-link a {
            color: #bae6fd;
            text-decoration: none;
            font-weight: 600;
        }

        .api-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .visit-details {
                flex-direction: column;
                gap: 6px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 网站访问统计</h1>
            <p>实时数据展示 · 最后更新: <span id="lastUpdated"></span></p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-value" id="totalVisits">0</div>
                <div class="stat-label">总访问次数</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">📅</div>
                <div class="stat-value" id="todayVisits">0</div>
                <div class="stat-label">今日访问次数</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">📱</div>
                <div class="stat-value" id="deviceCount">0</div>
                <div class="stat-label">设备类型数量</div>
            </div>
        </div>

        <div class="chart-card">
            <h2>📊 设备分布统计</h2>
            <div class="device-list" id="deviceList"></div>
        </div>

        <div class="recent-visits">
            <h2>⏰ 最近访问记录</h2>
            <div class="visit-list" id="visitList"></div>
        </div>

        <div class="api-link">
            <p>API 接口: <a href="/api/stats?details=true" target="_blank">/api/stats?details=true</a></p>
        </div>
    </div>

    <script>
        const deviceIcons = {
            'Windows': '🖥️',
            'iPhone': '📱',
            'Android': '🤖',
            'Mac': '💻',
            'iPad': '📱',
            'Linux': '🐧',
            'Unknown': '❓'
        };

        const browserIcons = {
            'Chrome': '🌐',
            'Safari': '🦊',
            'Firefox': '🦊',
            'Edge': '🔵',
            'Unknown': '❓'
        };

        async function loadStats() {
            try {
                const response = await fetch('/api/stats?details=true');
                const data = await response.json();

                document.getElementById('totalVisits').textContent = data.totalVisits.toLocaleString();
                document.getElementById('todayVisits').textContent = data.todayVisits.toLocaleString();
                document.getElementById('lastUpdated').textContent = data.lastUpdated;
                document.getElementById('deviceCount').textContent = Object.keys(data.deviceStats).length;

                const deviceList = document.getElementById('deviceList');
                deviceList.innerHTML = '';

                const totalDevices = Object.values(data.deviceStats).reduce((sum, count) => sum + count, 0);

                Object.entries(data.deviceStats).sort((a, b) => b[1] - a[1]).forEach(([device, count]) => {
                    const percentage = totalDevices > 0 ? Math.round((count / totalDevices) * 100) : 0;
                    const icon = deviceIcons[device] || '❓';
                    
                    const deviceItem = document.createElement('div');
                    deviceItem.className = 'device-item';
                    deviceItem.innerHTML = `
                        <div class="device-icon">${icon}</div>
                        <div class="device-info">
                            <div class="device-name">${device}</div>
                            <div class="device-count">${count} 次访问 (${percentage}%)</div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${percentage}%"></div>
                            </div>
                        </div>
                    `;
                    deviceList.appendChild(deviceItem);
                });

                const visitList = document.getElementById('visitList');
                visitList.innerHTML = '';

                data.recentVisits.slice(0, 10).forEach(visit => {
                    const deviceIcon = deviceIcons[visit.device] || '❓';
                    const browserIcon = browserIcons[visit.browser] || '❓';
                    
                    const visitItem = document.createElement('div');
                    visitItem.className = 'visit-item';
                    visitItem.innerHTML = `
                        <div class="visit-header">
                            <span class="visit-time">${visit.time}</span>
                            <span class="visit-country">${visit.country === 'Unknown' ? '🌍' : visit.country}</span>
                        </div>
                        <div class="visit-details">
                            <div class="detail-item">${deviceIcon} ${visit.device}</div>
                            <div class="detail-item">${browserIcon} ${visit.browser}</div>
                            <div class="detail-item">💻 ${visit.os}</div>
                        </div>
                    `;
                    visitList.appendChild(visitItem);
                });
            } catch (error) {
                console.error('加载统计数据失败:', error);
                document.body.innerHTML = '<div style="text-align: center; color: white;"><h2>❌ 加载失败</h2><p>无法获取统计数据，请稍后重试</p></div>';
            }
        }

        loadStats();
        
        // 每30秒刷新一次
        setInterval(loadStats, 30000);
    </script>
</body>
</html>
